architectury {
    minecraft = rootProject.minecraft_version
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        java.srcDir project.file("../common/src/main/java")
        resources.srcDir project.file("../common/src/main/resources")
    }
    test {
        java.srcDir project.file("../common/src/test/java")
    }
}

repositories {
    mavenLocal()
    maven {
        url "https://maven.architectury.dev/"
    }

    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Required at compile time and included in the development run configuration.
    modImplementation("maven.modrinth:epic-fight:${rootProject.epicfight_version}")

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
}

processResources {
    inputs.properties([
        mod_id: project.mod_id,
        mod_version: project.version,
        minecraft_version: project.minecraft_version,
        neoforge_version: project.neoforge_version,
        epicfight_version: project.epicfight_version
    ])
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(inputs.properties)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
